syntax = "proto3";

package jobdeck.job.v1;

import "google/protobuf/timestamp.proto";
import "jobdeck/job/v1/execution.proto";
import "jobdeck/job/v1/job.proto";

message ClaimedExecution {
  string execution_id = 1;
  string lease_token = 2;
  google.protobuf.Timestamp lease_expires_at = 3;

  int32 attempt = 4;
  JobSpec job_spec = 5;
  string job_id = 6;
}

service ExecutionQueueService {
  rpc ClaimExecutions(ClaimExecutionsRequest) returns (ClaimExecutionsResponse);
  rpc ReportExecutionResult(ReportExecutionResultRequest) returns (ReportExecutionResultResponse);
}

message ClaimExecutionsRequest {
  reserved 2;
  reserved "lease_duration";

  int32 max_count = 1;
}

message ClaimExecutionsResponse {
  repeated ClaimedExecution executions = 1;
}

message ReportExecutionResultRequest {
  reserved 5;
  reserved "duration";

  string execution_id = 1;
  string lease_token = 2;
  ExecutionStatus status = 3;
  ExecutionResult result = 4;
}

message ReportExecutionResultResponse {
  reserved "execution";
  reserved 1;
}
