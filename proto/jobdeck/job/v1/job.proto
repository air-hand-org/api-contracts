syntax = "proto3";

package jobdeck.job.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

message JobSpec {
  reserved 1;
  reserved "name";

  JobType type = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  oneof config {
    option (buf.validate.oneof).required = true;

    HttpJobConfig http = 10;
  }

  RetryPolicy retry_policy = 20 [(buf.validate.field).required = true];
}

message Job {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string owner_id = 2 [(buf.validate.field).string.uuid = true];
  bool enabled = 3;
  string name = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 70
  }];

  JobSpec spec = 10 [(buf.validate.field).required = true];

  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;
}

enum JobType {
  JOB_TYPE_UNSPECIFIED = 0;
  JOB_TYPE_HTTP_REQUEST = 1;
}

enum HttpMethod {
  HTTP_METHOD_UNSPECIFIED = 0;
  HTTP_METHOD_GET = 1;
  HTTP_METHOD_HEAD = 2;
  HTTP_METHOD_POST = 3;
  HTTP_METHOD_PUT = 4;
  HTTP_METHOD_PATCH = 5;
  HTTP_METHOD_DELETE = 6;
}

message StatusCodeRange {
  int32 from = 1 [(buf.validate.field).int32.gte = 1];
  int32 to = 2 [(buf.validate.field).int32.gte = 1];

  option (buf.validate.message).cel = {
    id: "from-lower-than-to"
    message: "from must be less than to"
    expression: "this.from < this.to"
  };
}

message StatusCodes {
  repeated int32 codes = 1 [(buf.validate.field).repeated.items.int32.gte = 1];
  repeated StatusCodeRange ranges = 2;
}

message HttpJobConfig {
  HttpMethod method = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string url = 2 [(buf.validate.field).string = {
    min_len: 1
    uri: true
  }];
  repeated HttpHeader headers = 3;
  bytes body = 4;

  google.protobuf.Duration timeout = 5;
  StatusCodes expected_status_codes = 6;
  int64 max_response_body_bytes = 8 [(buf.validate.field).int64.gte = 0];
  bool follow_redirects = 9;

  bool retry_on_timeout = 10;
  bool retry_on_network_error = 11;

  StatusCodes retry_on_status_codes = 12;
}

message HttpHeader {
  string name = 1 [(buf.validate.field).string.well_known_regex = KNOWN_REGEX_HTTP_HEADER_NAME];
  string value = 2 [(buf.validate.field).string.well_known_regex = KNOWN_REGEX_HTTP_HEADER_VALUE];
}

message RetryPolicy {
  int32 max_attempts = 1 [(buf.validate.field).int32.gte = 1];

  BackoffType backoff_type = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  google.protobuf.Duration initial_delay = 3;
  google.protobuf.Duration max_delay = 4;
}

enum BackoffType {
  BACKOFF_TYPE_UNSPECIFIED = 0;
  BACKOFF_TYPE_FIXED = 1;
  //  BACKOFF_TYPE_EXPONENTIAL = 2;
  //  BACKOFF_TYPE_EXPONENTIAL_WITH_JITTER = 3;
}

message CreateJobRequest {
  JobSpec spec = 1 [(buf.validate.field).required = true];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 70
  }];
}

message CreateJobResponse {
  Job job = 1;
}

message GetJobRequest {
  string job_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetJobResponse {
  Job job = 1;
}

message ListJobsRequest {
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  string page_token = 2;
}

message ListJobsResponse {
  repeated Job jobs = 1;
  string next_page_token = 2;
}

message UpdateJobRequest {
  reserved 2;
  reserved "enabled";

  string job_id = 1 [(buf.validate.field).string.uuid = true];
  JobSpec spec = 3 [(buf.validate.field).required = true];
  string name = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 70
  }];
}

message UpdateJobResponse {
  Job job = 1;
}

message SetJobEnabledRequest {
  string job_id = 1 [(buf.validate.field).string.uuid = true];
  bool enabled = 2;
}

message SetJobEnabledResponse {
  Job job = 1;
}

message DeleteJobRequest {
  string job_id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteJobResponse {}

service JobService {
  rpc CreateJob(CreateJobRequest) returns (CreateJobResponse);
  rpc UpdateJob(UpdateJobRequest) returns (UpdateJobResponse);
  rpc SetJobEnabled(SetJobEnabledRequest) returns (SetJobEnabledResponse);
  rpc DeleteJob(DeleteJobRequest) returns (DeleteJobResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}
