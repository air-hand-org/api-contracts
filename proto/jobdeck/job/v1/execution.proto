syntax = "proto3";

package jobdeck.job.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

message Execution {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string job_id = 2 [(buf.validate.field).string.uuid = true];
  ExecutionStatus status = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  ExecutionTrigger trigger = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated ExecutionEvent events = 5;

  int32 attempt = 6 [(buf.validate.field).int32.gte = 1];
  int32 max_attempts = 7 [(buf.validate.field).int32.gte = 1];

  ExecutionResult result = 10;

  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;
}

enum ExecutionStatus {
  EXECUTION_STATUS_UNSPECIFIED = 0;
  EXECUTION_STATUS_QUEUED = 1;
  EXECUTION_STATUS_RUNNING = 2;
  EXECUTION_STATUS_SUCCEEDED = 3;
  EXECUTION_STATUS_FAILED = 4;
  EXECUTION_STATUS_TIMED_OUT = 5;
  EXECUTION_STATUS_CANCELLED = 6;
}

message ExecutionEvent {
  ExecutionStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  google.protobuf.Timestamp created_at = 10;
}

enum ExecutionTrigger {
  EXECUTION_TRIGGER_UNSPECIFIED = 0;
  EXECUTION_TRIGGER_MANUAL = 1;
}

message ExecutionResult {
  reserved 10;
  reserved "error_message";

  oneof result {
    option (buf.validate.oneof).required = true;

    HttpExecutionResult http = 1;
  }
}

message HttpExecutionResult {
  int32 status_code = 1;
  HttpError error = 2;

  option (buf.validate.message).cel = {
    id: "http_result_response_or_error"
    message: "either status_code or error must be set"
    expression:
      "(this.status_code >= 100 && this.status_code <= 999 && !has(this.error))"
      "|| (this.status_code == 0 && has(this.error))"
  };
}

message HttpError {
  HttpErrorType type = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string message = 2;
}

enum HttpErrorType {
  HTTP_ERROR_TYPE_UNSPECIFIED = 0;
  HTTP_ERROR_TYPE_TIMEOUT = 1;
  HTTP_ERROR_TYPE_NETWORK = 2;
}

message GetExecutionRequest {
  string execution_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetExecutionResponse {
  Execution execution = 1;
}

message ListExecutionsRequest {
  string job_id = 1 [(buf.validate.field).string.uuid = true];
  int32 page_size = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  string page_token = 4;
}

message ListExecutionsResponse {
  repeated Execution executions = 1;
  string next_page_token = 2;
}

message DoExecutionRequest {
  string job_id = 1 [(buf.validate.field).string.uuid = true];
}

message DoExecutionResponse {
  Execution execution = 1;
}

service ExecutionService {
  rpc GetExecution(GetExecutionRequest) returns (GetExecutionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListExecutions(ListExecutionsRequest) returns (ListExecutionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc DoExecution(DoExecutionRequest) returns (DoExecutionResponse);
}
