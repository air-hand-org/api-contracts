name: Test

on:
  workflow_call:

permissions: {}

concurrency:
  group: api-contracts-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
      packages: read
      pull-requests: read
    runs-on: ubuntu-latest
    env:
      ASYNCAPI_IMAGE: jobdeck-asyncapi:local
      ASYNCAPI_MARKDOWN_TEMPLATE: /opt/asyncapi/node_modules/@asyncapi/markdown-template
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: true
      - parallel:
          - name: Restore Go cache
            uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
            with:
              path: |
                ~/go/pkg/mod
                ~/.cache/go-build
              key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
              restore-keys: |
                go-${{ runner.os }}-
          - name: Restore NuGet cache
            uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
            with:
              path: ~/.nuget/packages
              key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
              restore-keys: |
                nuget-${{ runner.os }}-
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build AsyncAPI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: asyncapi
          load: true
          tags: jobdeck-asyncapi:local
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/api-contracts-asyncapi:buildcache
      - name: Format protobuf
        run: make buf-fmt
      - name: Generate contract packages
        run: make generate
      - name: Tidy Go modules
        run: make go-tidy
      - name: Build Go packages
        run: make go-build
      - name: Build C# packages
        run: make cs-build
      - name: Check generated and formatted files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff --no-ext-diff HEAD --
            exit 1
          fi
      - name: Lint protobuf
        run: make buf-lint
      - name: Validate AsyncAPI contract
        run: make asyncapi-check
      - name: Check breaking changes
        run: make buf-breaking
