name: Test

on:
  workflow_call:

permissions: {}

concurrency:
  group: api-contracts-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
      packages: read
      pull-requests: read
    runs-on: ubuntu-latest
    env:
      ASYNCAPI_IMAGE: jobdeck-asyncapi:local
      ASYNCAPI_MARKDOWN_TEMPLATE: /opt/asyncapi/node_modules/@asyncapi/markdown-template
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: true
      - parallel:
          - name: Restore Go cache
            uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
            with:
              path: |
                ~/go/pkg/mod
                ~/.cache/go-build
              key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
              restore-keys: |
                go-${{ runner.os }}-
          - name: Restore NuGet cache
            uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
            with:
              path: ~/.nuget/packages
              key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
              restore-keys: |
                nuget-${{ runner.os }}-
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build AsyncAPI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: asyncapi
          load: true
          tags: jobdeck-asyncapi:local
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/api-contracts-asyncapi:buildcache
      - name: Format protobuf
        run: make buf-fmt
      - name: Generate contract packages
        run: make generate
      - name: Tidy Go modules
        run: make go-tidy
      - name: Build Go packages
        run: make go-build
      - name: Build C# packages
        run: make cs-build
      - name: Check generated and formatted files
        run: test -z "$(git status --porcelain)"
      - name: Lint protobuf
        run: make buf-lint
      - name: Validate AsyncAPI contract
        run: make asyncapi-check
      - name: Check breaking changes
        run: make buf-breaking
