name: Test

on:
  workflow_call:

permissions: {}

concurrency:
  group: api-contracts-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: true
      - name: Format protobuf
        run: buf format -w
      - name: Generate contract packages
        run: make buf-generate
      - name: Tidy Go modules
        run: |
          (cd packages/jobdeck-auth && go mod tidy)
          (cd packages/jobdeck-job && go mod tidy)
      - name: Test Go packages
        run: |
          (cd packages/jobdeck-auth && go test ./...)
          (cd packages/jobdeck-job && go test ./...)
      - name: Build C# packages
        run: |
          dotnet build packages/jobdeck-auth/csharp/Jobdeck.Auth.Contracts.csproj --configuration Release
          dotnet build packages/jobdeck-job/csharp/Jobdeck.Job.Contracts.csproj --configuration Release
      - name: Commit generated package migration
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref == 'feat/contracts-ci-publish' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          rm -rf gen
          git add -A gen packages .gitignore
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: regenerate contract packages'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Check generated and formatted files
        run: test -z "$(git status --porcelain)"
      - name: Lint protobuf
        run: buf lint
      - name: Check breaking changes
        run: buf breaking --against '.git#ref=refs/remotes/origin/main'
