name: Publish packages

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  nuget:
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: true
      - name: Generate C# contracts
        run: buf generate
      - name: Pack NuGet package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: dotnet pack gen/csharp/Jobdeck.Proto/Jobdeck.Proto.csproj --configuration Release --output artifacts -p:PackageVersion="${RELEASE_TAG#v}"
      - name: Publish NuGet package
        run: dotnet nuget push 'artifacts/*.nupkg' --source 'https://nuget.pkg.github.com/air-hand-org/index.json' --api-key '${{ github.token }}' --skip-duplicate
