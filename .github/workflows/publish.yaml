name: Publish packages

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  nuget:
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-slim
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: true
      - name: Resolve released package
        id: package
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^packages/.+/v[0-9] ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          package_path="${RELEASE_TAG%/v*}"
          echo "path=$package_path" >> "$GITHUB_OUTPUT"
      - name: Verify generated package is current
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: |
          make buf-generate
          git diff --exit-code -- "$PACKAGE_PATH"
      - name: Pack NuGet package
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: dotnet pack "$PACKAGE_PATH/csharp/Contracts.csproj" --configuration Release --output artifacts
      - name: Publish NuGet package
        env:
          NUGET_API_KEY: ${{ github.token }}
        run: dotnet nuget push 'artifacts/*.nupkg' --source 'https://nuget.pkg.github.com/air-hand-org/index.json' --api-key "$NUGET_API_KEY" --skip-duplicate
