on:
  workflow_call:

permissions: {}

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Intentionally reject the Conventional Commit `!` form so Release Please
          # cannot infer a Go module major-version bump from the squash subject.
          types: |
            [a-z][a-z0-9-]*
          headerPattern: '^([a-z][a-z0-9-]*)(?:\(([^()\s!:]+)\))?: (.+)$'
          headerPatternCorrespondence: type, scope, subject

  test:
    uses: ./.github/workflows/_test.yaml
    permissions:
      contents: read
      packages: read
      pull-requests: read
