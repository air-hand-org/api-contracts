on:
  workflow_call:

permissions: {}

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test PR title validation
        run: python3 -m unittest discover -s scripts -p 'test_check_pr_title.py'
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check_pr_title.py

  test:
    uses: ./.github/workflows/_test.yaml
    permissions:
      contents: read
      packages: read
      pull-requests: read
