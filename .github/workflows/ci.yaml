name: 'CI'

on:
  merge_group:
    types: [checks_requested]
    branches:
      - main
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

permissions: {}

jobs:
  # Add CI jobs to _ci.yaml so this reusable workflow remains the single gate
  # consumed by check-result.
  ci:
    uses: ./.github/workflows/_ci.yaml
    permissions:
      contents: read
      packages: read
      pull-requests: read

  check-result:
    needs: ci
    runs-on: ubuntu-slim
    if: always() && needs.ci.result != 'success'
    steps:
      - run: exit 1
