name: Publish AsyncAPI image

on:
  push:
    branches:
      - ci/ghcr-buildkit-cache
    paths:
      - asyncapi/Dockerfile
      - asyncapi/package.json
      - .github/workflows/publish-asyncapi-image.yaml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and push AsyncAPI cache test image
        uses: docker/build-push-action@v7
        with:
          context: asyncapi
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/api-contracts-asyncapi:cache-test
          cache-from: type=gha,scope=asyncapi
          cache-to: type=inline
