version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      path: jobdeck/auth
      value: github.com/air-hand-org/api-contracts/packages/jobdeck-auth/gen/go
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: packages/jobdeck-auth/gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: packages/jobdeck-auth/gen/go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/gosimple:v1.20.0
    out: packages/jobdeck-auth/gen/go
    opt:
      - paths=source_relative
      - simple
  - remote: buf.build/protocolbuffers/csharp:v35.1
    out: packages/jobdeck-auth/csharp/Generated
    include_imports: true
    opt:
      - base_namespace=
  - remote: buf.build/grpc/csharp:v1.83.0
    out: packages/jobdeck-auth/csharp/Generated
    include_imports: true
    opt:
      - base_namespace=
inputs:
  - directory: proto
    paths:
      - jobdeck/auth
